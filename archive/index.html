<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafaf7">
  <title>Spoonernym · Past puzzles</title>
  <meta name="description" content="Every past Spoonernym puzzle, with your results.">
  <link rel="icon" href="../assets/images/favicon.svg?v=946979eb">
  <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png?v=997ed763">
  <link rel="manifest" href="../assets/images/manifest.webmanifest?v=403dd8ba">
  <link rel="stylesheet" href="../assets/common.css?v=3e714fc5">
  <link rel="stylesheet" href="../assets/archive.css?v=db04463d">
  <script src="../assets/common.js?v=825843c1"></script>
</head>
<body>
  <header>
    <a class="back" href="../index.html" aria-label="Today's puzzle">‹ Today</a>
    <h1>Past puzzles</h1>
  </header>

  <main>
    <noscript><p class="summary">The calendar needs JavaScript.</p></noscript>
    <p class="summary" id="summary"></p>
    <div class="month-nav">
      <button type="button" class="small-btn nav-btn" id="prev-month" aria-label="Previous month">‹</button>
      <h2 id="month-title" aria-live="polite"></h2>
      <button type="button" class="small-btn nav-btn" id="next-month" aria-label="Next month">›</button>
    </div>
    <div id="calendar"></div>
    <ul class="legend" aria-label="Key">
      <li><span class="day solved" aria-hidden="true">3</span> Solved (guesses)</li>
      <li><span class="day playing" aria-hidden="true">…</span> In progress</li>
      <li><span class="day unplayed" aria-hidden="true"></span> Not played</li>
      <li><span class="day unplayed latest" aria-hidden="true"></span> Latest</li>
    </ul>
    <p class="byline">By flapjack</p>
  </main>

  <script id="archive" type="application/json">{"dates": ["2026-10-13", "2026-10-14", "2026-10-15", "2026-10-16", "2026-10-17", "2026-10-18", "2026-10-19", "2026-10-20", "2026-10-21", "2026-10-22", "2026-10-23", "2026-10-24", "2026-10-25", "2026-10-26"]}</script>
  <script src="../assets/archive.js?v=16412d5a"></script>
</body>
</html>
